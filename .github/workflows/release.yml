name: Release Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build extension zip
        run: |
          zip -r "Global-Media-Controller-${{ github.ref_name }}.zip" \
            manifest.json \
            background.js \
            mediaAgent.js \
            popup.html \
            popup.js \
            popup.css \
            icons/

      - name: Extract changelog for this version
        run: |
          VERSION="${{ github.ref_name }}"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${VERSION}$" | head -1)
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" >> release_notes.txt
            else
              git log --pretty=format:"- %s" >> release_notes.txt
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Global Media Controller ${{ github.ref_name }}"
          body_path: release_notes.txt
          files: "Global-Media-Controller-${{ github.ref_name }}.zip"
          draft: false
          prerelease: false
